<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="main-container">
    <!-- Navbar -->
    <section class="navbar">
      <h1>Admin</h1>
      <div class="search">
        <input type="text" id="searchInput" placeholder="Search 🔎︎ ...">
      </div>
      <button class="user-button"><span>Sync</span></button>
    </section>

    <!-- User Form -->
    <section class="container">
      <h2>Fill User Information</h2>

      <form id="userForm">
        <input type="text" id="name" placeholder="Enter name" required>
        <input type="email" id="email" placeholder="name@gmail.com" required>
        <input type="number" id="salary" placeholder="Enter salary" required>
        <input type="date" id="date" placeholder="YYYY-MM-DD" required>

        <button type="submit" id="submitBtn">+ Add user</button>
      </form>

      <!-- Data Table -->
      <table id="userTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Salary</th>
            <th>Date of Birth</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Pagination -->
    <section class="pagination">
      <button class="prev-btn" onclick="prev()">⬅ Prev</button>
      <button class="next-btn" onclick="next()">Next ➡</button>
    </section>
  </section>

  <script src="app.js"></script>
</body>

</html>
